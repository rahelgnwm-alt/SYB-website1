@if (authService.isLoginModalOpen()) {
<div class="modal-backdrop" (click)="close()">
  <div class="auth-card" (click)="$event.stopPropagation()">
    <button class="btn-close-modal" (click)="close()" title="Tutup">✕</button>

    <div class="auth-header">
      <div class="auth-icon-badge" [class.admin-glow]="isDetectedAdmin()">
        {{ isDetectedAdmin() ? '👑' : '🌸' }}
      </div>
      <h2 class="auth-title">Masuk ke Akun SYB Official</h2>
    </div>

    <!-- Login Form -->
    <form (submit)="handleLogin($event)" class="auth-form">
      <div class="form-group">
        <label for="auth-user">Email / Username</label>
        <input id="auth-user" type="text" [value]="username()" (input)="username.set($any($event.target).value)"
          required placeholder="Masukkan email atau username Anda" class="auth-input" />
      </div>

      <div class="form-group">
        <label for="auth-pass">Kata Sandi</label>
        <div class="password-field-wrap">
          <input
            id="auth-pass"
            [type]="showPassword() ? 'text' : 'password'"
            [value]="password()"
            (input)="password.set($any($event.target).value)"
            required
            placeholder="••••••••"
            class="auth-input auth-input--password"
          />
          <button
            type="button"
            class="btn-toggle-password"
            (click)="togglePasswordVisibility()"
            [attr.aria-label]="showPassword() ? 'Sembunyikan kata sandi' : 'Lihat kata sandi'"
            [attr.aria-pressed]="showPassword()"
            [title]="showPassword() ? 'Sembunyikan kata sandi' : 'Lihat kata sandi'"
          >
            @if (showPassword()) {
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94" />
                <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19" />
                <path d="M14.12 14.12a3 3 0 1 1-4.24-4.24" />
                <line x1="1" y1="1" x2="23" y2="23" />
              </svg>
            } @else {
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                <circle cx="12" cy="12" r="3" />
              </svg>
            }
          </button>
        </div>
      </div>

      @if (authService.loginError()) {
      <div class="auth-error">
        <span>⚠️</span> {{ authService.loginError() }}
      </div>
      }

      <button type="submit" class="btn-auth-submit" [class.admin-btn]="isDetectedAdmin()"
        [class.cust-btn]="!isDetectedAdmin()" [disabled]="authService.isAuthenticating()" id="btn-auth-submit">
        @if (authService.isAuthenticating()) {
        <span>Memverifikasi Akun...</span>
        } @else if (isDetectedAdmin()) {
        <span>👑 Masuk ke Shopify Admin →</span>
        } @else {
        <span>🌸 Masuk ke Profil Pelanggan →</span>
        }
      </button>
    </form>
  </div>
</div>
}

<section class="go" aria-labelledby="go-title">
  <div class="container go__grid">
    <div class="go__media" appReveal="clip" data-progress>
      <img src="images/on-the-go.jpg" alt="Perempuan berhijab touch-up blush di jalan kota" loading="lazy" />
      <svg class="go__sticker" viewBox="0 0 200 200" aria-hidden="true">
        <defs><path id="circlePath" d="M100,100 m-78,0 a78,78 0 1,1 156,0 a78,78 0 1,1 -156,0" /></defs>
        <circle cx="100" cy="100" r="100" fill="#fff" />
        <text><textPath href="#circlePath">travel friendly ✦ tas kecil, glow maksimal ✦ </textPath></text>
        <text x="100" y="114" text-anchor="middle" class="go__sticker-heart">♥</text>
      </svg>
    </div>

    <div class="go__text">
      <p class="eyebrow" appReveal>Travel friendly</p>
      <h2 id="go-title" class="display go__title" appReveal [revealDelay]="80">Glow<br />on the <span class="gradient-text">go</span></h2>
      <p class="go__lead" appReveal [revealDelay]="160">
        Dari kelas pagi sampai nongkrong malam — ukuran mungil yang muat di pouch, hasil glowing yang tahan seharian.
        Touch-up kapan pun, di mana pun.
      </p>
      <ul class="go__chips" appReveal [revealDelay]="240">
        <li>Cheek Blusher · Jojoba Oil</li>
        <li>Lip Cream Matte · 8 shade</li>
        <li>Body Toner · 100ml</li>
      </ul>
      <a class="btn btn--primary" href="{{ shopUrl }}/collections/cosmetic" appMagnetic appReveal [revealDelay]="320" id="go-shop">
        Belanja Make Up
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M13 6l6 6-6 6" stroke-linecap="round" stroke-linejoin="round" /></svg>
      </a>
    </div>
  </div>
</section>

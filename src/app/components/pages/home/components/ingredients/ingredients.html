<section class="ingredients" aria-label="Bahan aktif">
  <div class="ingredients__row">
    <div class="ingredients__track">
      @for (n of [0, 1]; track n) {
        @for (ing of ingredients; track ing; let k = $index) {
          <span [class.outline]="k % 2 === 1">{{ ing }}</span><i>✦</i>
        }
      }
    </div>
  </div>
  <div class="ingredients__row ingredients__row--rev">
    <div class="ingredients__track">
      @for (n of [0, 1]; track n) {
        @for (ing of ingredients; track ing; let k = $index) {
          <span [class.outline]="k % 2 === 0">{{ ing }}</span><i>♥</i>
        }
      }
    </div>
  </div>
</section>

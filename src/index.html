  <link rel="preload" as="image" href="images/hero.jpg">
  <script>
    (function () {
      function handleChunkError(msg) {
        if (/Failed to fetch dynamically imported module|Loading chunk|ERR_ABORTED|chunk-[A-Za-z0-9_-]+\.js/i.test(msg)) {
          var key = 'syb_chunk_retry';
          var last = sessionStorage.getItem(key);
          var now = Date.now();
          if (!last || (now - parseInt(last, 10)) > 6000) {
            sessionStorage.setItem(key, String(now));
            window.location.reload();
          }
        }
      }
      window.addEventListener('error', function (e) {
        var msg = (e && e.message) ? e.message : '';
        if (!msg && e && e.target && (e.target.src || e.target.href)) {
          msg = String(e.target.src || e.target.href);
        }
        handleChunkError(msg);
      }, true);
      window.addEventListener('unhandledrejection', function (e) {
        var reason = e && e.reason ? (e.reason.message || String(e.reason)) : '';
        handleChunkError(reason);
      });
    })();
  </script>
</head>
